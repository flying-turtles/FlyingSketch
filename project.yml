name: FlyingSketch
options:
  bundleIdPrefix: com.flyingturtle
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    TARGETED_DEVICE_FAMILY: "2"
    DEVELOPMENT_TEAM: WDJPX25GFC
packages:
  FlyingSketchKit:
    path: Packages/FlyingSketchKit
targets:
  FlyingSketch:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Catalog/**"]
      # Bundled part catalog (generated by Tools/CatalogBuilder), copied as Catalog/ into the app bundle.
      - path: App/Catalog
        type: folder
        buildPhase: resources
    dependencies:
      - package: FlyingSketchKit
        product: SketchCore
      - package: FlyingSketchKit
        product: InkEngine
      - package: FlyingSketchKit
        product: CanvasUI
      - package: FlyingSketchKit
        product: PartsKit
      - package: FlyingSketchKit
        product: PhotoPartKit
      - package: FlyingSketchKit
        product: ExportKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flyingturtle.flyingsketch
        CODE_SIGN_ENTITLEMENTS: App/FlyingSketch.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo of a part to turn it into a FlyingSketch part."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
